<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Minimalist Geometric Layers / Inventory Box -->
  <rect width="512" height="512" rx="96" fill="#0f172a" />
  
  <g fill="none" stroke="#f8fafc" stroke-width="24" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top layer / box lid isometric -->
    <path d="M 256 128 L 384 192 L 256 256 L 128 192 Z" fill="#1e293b" />
    
    <!-- Middle layer -->
    <path d="M 128 248 L 256 312 L 384 248" />
    
    <!-- Bottom layer / base -->
    <path d="M 128 304 L 256 368 L 384 304" />
    
    <!-- Center vertical alignment line -->
    <path d="M 256 256 L 256 368" stroke="#38bdf8" />
  </g>
</svg>
